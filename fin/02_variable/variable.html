<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品情報</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <main class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <!-- ヘッダー -->
            <div class="bg-sky-500 px-6 py-8 text-white">
                <p class="text-xs font-semibold tracking-widest uppercase opacity-80">Product</p>
                <h1 id="item-name" class="mt-1 text-3xl font-bold"></h1>
            </div>

            <!-- 詳細 -->
            <dl class="divide-y divide-slate-100">
                <div class="flex items-center justify-between px-6 py-4">
                    <dt class="text-sm font-medium text-slate-500">価格</dt>
                    <dd class="text-xl font-semibold text-slate-900">
                        <span id="price"></span><span class="ml-1 text-sm font-normal text-slate-500">円</span>
                    </dd>
                </div>

                <div class="flex items-center justify-between px-6 py-4">
                    <dt class="text-sm font-medium text-slate-500">個数</dt>
                    <dd class="text-xl font-semibold text-slate-900">
                        <span id="quantity"></span><span class="ml-1 text-sm font-normal text-slate-500">個</span>
                    </dd>
                </div>

                <div class="flex items-center justify-between px-6 py-4">
                    <dt class="text-sm font-medium text-slate-500">割引率</dt>
                    <dd id="discount" class="rounded-full bg-rose-50 px-3 py-1 text-base font-semibold text-rose-600"></dd>
                </div>

                <div class="flex items-center justify-between px-6 py-4">
                    <dt class="text-sm font-medium text-slate-500">税率</dt>
                    <dd id="tax-rate" class="rounded-full bg-emerald-50 px-3 py-1 text-base font-semibold text-emerald-600"></dd>
                </div>
            </dl>
        </div>
    </main>
    <script src="js/variable.js"></script>
</body>

</html>
