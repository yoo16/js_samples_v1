<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d">
  <title id="t">関数の外の変数と中の変数</title>
  <desc id="d">関数の中からは外の変数 height を使えるが、外から関数の中の変数 y は使えない</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10b981"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#ffffff"/>
  <g font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">
    <!-- 外側 -->
    <rect x="20" y="20" width="680" height="340" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="40" y="52" font-size="16" font-weight="700" fill="#334155">関数の外（グローバル）</text>

    <!-- 外の変数 -->
    <rect x="50" y="90" width="190" height="64" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="145" y="130" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="monospace">height = 169.5</text>

    <!-- 内側 -->
    <rect x="330" y="80" width="340" height="260" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="350" y="112" font-size="16" font-weight="700" fill="#075985">calculate() の中（ローカル）</text>

    <rect x="360" y="140" width="130" height="56" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="425" y="175" font-size="17" font-weight="700" fill="#075985" text-anchor="middle" font-family="monospace">x（引数）</text>
    <rect x="510" y="140" width="130" height="56" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="575" y="175" font-size="17" font-weight="700" fill="#075985" text-anchor="middle" font-family="monospace">y</text>
    <text x="500" y="240" font-size="13" fill="#0369a1" text-anchor="middle">x と y は、この関数の中だけで使える</text>

    <!-- ラベル -->
    <text x="290" y="82" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">使える ○</text>
    <text x="290" y="318" font-size="13" font-weight="700" fill="#e11d48" text-anchor="middle">使えない ×</text>
  </g>
  <!-- 外 → 中: 使える -->
  <line x1="240" y1="122" x2="326" y2="122" stroke="#10b981" stroke-width="3" marker-end="url(#a)"/>
  <!-- 中 → 外: 使えない -->
  <line x1="326" y1="290" x2="150" y2="290" stroke="#e11d48" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#b)"/>
  <g font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">
    <text x="145" y="316" font-size="13" fill="#e11d48" text-anchor="middle" font-family="monospace">console.log(y) → エラー</text>
    <text x="145" y="190" font-size="13" fill="#047857" text-anchor="middle">関数の中から読める</text>
  </g>
</svg>
